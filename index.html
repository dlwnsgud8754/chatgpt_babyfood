function foodArt(r){return `<div class="food-art" style="background:${r?.vegetables.includes('당근')?'#f5e9de':r?.vegetables.includes('단호박')?'#f3eedc':'#e9efe2'}"><span class="emoji">${emoji(r)}</span><div class="dish"><div>• • •<br> • •</div></div></div>`}
function allergenHints(r){if(!r)return '';const names=[r.grain1,r.grain2,r.protein,...r.vegetables.split(/[+,·]/)].filter(Boolean);return names.map(n=>db.ingredients.find(i=>i.name===n)).filter(i=>i&&i.status==='주의').map(i=>tag(i.name+' 주의','warn')).join(' ')}
function mealCard(slot,label,time){const p=plan(),name=p[slot],r=recipe(name),records=db.logs.filter(l=>l.date===date&&l.slot===slot);return `<article class="card"><div class="meal-top"><span class="period ${slot}">${label}</span><span class="tiny">${time}</span>${button('pick',icon('plus'),'','data-slot="'+slot+'" aria-label="'+label+' 메뉴 변경"')}</div>${name?`${foodArt(r)}<h3>${esc(name)}</h3><p>${r?esc([r.grain1,r.protein,r.vegetables].filter(Boolean).join(' · ')):'직접 입력한 메뉴'}</p><div style="margin-top:8px">${allergenHints(r)}</div><div class="meal-foot"><span>${records.length?fmt(records.reduce((s,l)=>s+l.eaten,0))+'g 먹었어요':'아직 기록이 없어요'}</span>${button('addLog','섭취 기록 '+icon('arrow'),'','data-slot="'+slot+'"')}</div>`:button('pick','<span class="round">'+icon('plus')+'</span>어떤 한 끼를 먹을까요?<small>레시피로 식단을 채워보세요</small>','empty','data-slot="'+slot+'"')}</article>`}
function recipeCard(r){return `<article class="recipe-card">${foodArt(r).replace('<div class="food-art"','<div class="food-art" role="img" aria-label="이유식 일러스트"').replace('<span class="emoji">','<span class="recipe-symbol">'+esc(r.symbol||'첫 밥솥')+'</span><span class="emoji">')}<div class="recipe-body">${tag(r.stage+' · 밥솥')}${r.newFood?' '+tag('NEW '+r.newFood,'new'):''}<h3>${esc(r.name)}</h3><p>${esc(r.vegetables||'재료를 추가해 주세요')}</p><div class="bottom"><span>${fmt(r.portionG)}g × ${fmt(r.portions)}개</span><span>${r.symbol&&'BCD'.includes(r.symbol)?'★ 소고기 베이스':''}</span></div><div class="card-actions">${button('recipeDetail',icon('book')+'보기','','data-id="'+esc(r.id)+'"')}${button('schedule',icon('plus')+'식단','','data-id="'+esc(r.id)+'"')}${button('editRecipe',icon('edit'),'','data-id="'+esc(r.id)+'" aria-label="레시피 수정"')}</div></div></article>`}
function daily(){const p=plan(),logs=db.logs.filter(l=>l.date===date);return title('오늘도, 건강한 한 입 🌿',`${db.profile.name}의 밥솥 이유식과 소중한 하루를 기록해요.`)+`<section class="hero"><div><div class="hero-label">${icon('leaf')} 작은 식탁에 담는 정성</div><h2>한 솥의 정성이<br>매일의 한 입이 되도록.</h2><p>준비한 재료, 처음 만난 맛, 잘 먹은 한 끼.<br>아율의 속도에 맞춰 차근차근 함께해요.</p>${button('addRecipe','밥솥 레시피 만들기 '+icon('arrow'),'primary')}</div><div class="hero-art"><span class="vegetable v1">🥕</span><span class="vegetable v2">🥦</span><div class="pot"></div><span class="spark">✧</span><span class="handwritten">made with love ♡</span></div></section><div class="stats"><div class="stat"><div class="stat-icon">${icon('bowl')}</div><div><p>선택일 먹은 양</p><strong>${fmt(logs.reduce((a,l)=>a+l.eaten,0))}<small> g</small></strong></div><span class="stat-note">한 숟가락씩 차곡차곡</span></div><div class="stat"><div class="stat-icon">${icon('check')}</div><div><p>통과한 재료</p><strong>${db.ingredients.filter(i=>i.status==='통과').length}<small> 가지</small></strong></div><span class="stat-note">새로운 맛을 알아가요</span></div><div class="stat"><div class="stat-icon">${icon('heart')}</div><div><p>반응 기록</p><strong>${db.logs.filter(l=>l.symptom!=='없음').length}<small> 건</small></strong></div><span class="stat-note">아기의 반응을 살펴요</span></div></div><div class="section-heading"><div><h2>오늘의 작은 식탁 ${tag('밥솥 이유식')}</h2><p>오전 · 오후 · 간식, 우리 아기에게 맞는 하루</p></div>${button('goWeek','주간 보기 '+icon('right'),'text-btn')}</div>${dateBar()}<div class="cards">${slots.map(s=>mealCard(...s)).join('')}</div><div class="daily-notes">${p.newFood?tag('NEW '+p.newFood,'new'):tag('새 재료 계획 없음')}${p.note?'<span>✎ '+esc(p.note)+'</span>':''}${p.dayNumber?'<span>원본 표 생후 '+esc(p.dayNumber)+'일</span>':''}</div><div class="tip">💡 <div><strong>처음 만나는 재료는 천천히</strong>계획한 새 재료와 실제 알레르기 테스트 결과는 별도로 기록해요. 기존 반응이 있는 재료는 의료진과 확인하세요.</div></div><div class="section-heading"><div><h2>우리 집 밥솥 레시피 ${icon('leaf')}</h2><p>두 표의 재료와 조리 메모를 그대로 담았어요</p></div>${button('goRecipes','전체 보기 '+icon('right'),'text-btn')}</div><div class="recipe-grid">${db.recipes.slice(0,3).map(recipeCard).join('')}</div>`}
function week(){const start=monday(date);return title('아율의 일주일 식단','한 번의 준비로 든든한 한 주를 만들어 가요.')+`<div class="section-heading"><div><h2>${human(start)}부터 7일</h2><p>비어 있는 메뉴를 눌러 채우거나 기존 식단을 변경하세요.</p></div>${button('print',icon('calendar')+'인쇄','outline')}</div>${dateBar(true)}<div class="week-grid">${Array.from({length:7},(_,i)=>{const d=offset(start,i),p=plan(d);return `<article class="day-card ${d===date?'current':''}"><div class="day-head"><span>${['월','화','수','목','금','토','일'][i]}</span>${button('openDay',`<strong>${dt(d).getDate()}</strong>`,'','data-date="'+d+'" aria-label="'+d+' 식단 열기"')}</div><div class="day-body">${slots.map(([s,l])=>button('pick',`<span>${l}</span><p>${esc(p[s]||'+ 메뉴 추가')}</p>`,'week-meal '+(!p[s]?'empty-slot':''),'data-slot="'+s+'" data-date="'+d+'"')).join('')}${p.newFood?'<div class="week-new">NEW · '+esc(p.newFood)+'</div>':''}${p.note?'<p class="week-note">'+esc(p.note)+'</p>':''}${button('editDay',icon('edit')+'메모','tiny','data-date="'+d+'"')}</div></article>`}).join('')}</div><details class="template"><summary>원본 주간 기호 패턴 · 준비 일정</summary><div class="table-scroll"><table><thead><tr><th>끼니</th>${['월','화','수','목','금','토','일'].map(d=>'<th>'+d+'</th>').join('')}</tr></thead><tbody><tr><td>오전</td>${['A*','B* ★','B* ★','D* ★','D* ★','E','A*'].map(s=>'<td>'+s+'</td>').join('')}</tr><tr><td>오후</td>${['C ★','A','F','F','E','C ★','C ★'].map(s=>'<td>'+s+'</td>').join('')}</tr><tr><td>준비</td><td></td><td>DEF 준비</td><td></td><td></td><td>ABC 준비</td><td>신규 간식</td><td></td></tr></tbody></table></div><p class="muted" style="margin-top:10px">★ B·C·D는 소고기 베이스 필수. *는 원본 기호입니다. 빨간색 서식은 전달되지 않아 별도의 새 재료 칸을 기준으로 표시합니다. D·E·F 레시피는 아직 제공되지 않았습니다.</p></details><div class="tip">🌿 <div>오전·오후의 구체적인 식단은 두 번째 표에서 가져왔습니다. 패턴을 자동 적용하거나 미입력 레시피를 임의로 채우지 않았어요.</div></div>`}
function recipes(){return title('한 솥에 담는, 정성 한 스푼','불리기 전 곡물부터 최종 소분량까지, 우리 집 레시피를 관리해요.','addRecipe','레시피 추가')+`<div class="toolbar"><input class="search" id="recipeSearch" placeholder="레시피 이름·재료 검색" aria-label="레시피 검색" value="${esc(search)}"><span class="tiny">총 ${db.recipes.length}개의 레시피</span></div><div class="filters">${['전체','초기','중기','후기','완료기'].map(s=>button('filterRecipe',s,recipeFilter===s?'selected':'','data-value="'+s+'"')).join('')}</div><div class="recipe-grid" id="recipeResults">${recipeResults()}</div><div class="tip">🥩 <div><strong>우리 집 규칙: B·C·D는 소고기 베이스</strong>해당 기호를 저장할 때 단백질을 확인합니다. 총 채소량은 2~3가지 합계이며, 개별 채소량이 없는 경우 균등 분배를 추정하지 않습니다.</div></div>`}
function recipeResults(){const list=db.recipes.filter(r=>(recipeFilter==='전체'||r.stage===recipeFilter)&&[r.name,r.vegetables,r.protein,r.grain1,r.grain2].join(' ').includes(search));return list.map(recipeCard).join('')||'<div class="empty-state">조건에 맞는 레시피가 없어요.</div>'}
function ingredients(){const list=db.ingredients.filter(i=>materialFilter==='전체'||i.status===materialFilter);return title('처음 만나는 맛, 조심스러운 한 입','통과 재료와 실제 반응을 구분해 차근차근 기록해요.','addIngredient','재료 추가')+`<div class="filters">${['전체','통과','테스트 중','미확인','주의'].map(s=>button('filterMaterial',s+(s==='전체'?'':` ${db.ingredients.filter(i=>i.status===s).length}`),materialFilter===s?'selected':'','data-value="'+s+'"')).join('')}</div><div class="material-list">${list.map(i=>`<article class="material-row"><span class="material-name"><strong>${esc(i.name)}</strong></span>${tag(i.status,i.status==='주의'?'warn':i.status==='통과'?'':'new')}<span class="notes">${i.date?esc(i.date)+' · ':''}${esc(i.note||'기록된 메모가 없어요')}</span>${button('editIngredient',icon('edit')+'수정','','data-id="'+esc(i.id)+'"')}</article>`).join('')||'<div class="empty-state">등록된 재료가 없어요.</div>'}</div><div class="tip warning">⚠ <div><strong>청경채: 원본 통과 목록에 있지만 ‘설사’ 메모가 있어요.</strong>이 메모만으로 알레르기 여부를 판정하지 않았습니다. 상태를 확인해 수정하세요. 발진·구토 등 반응이 의심되면 섭취를 중단하고 의료진과 상담하세요. 호흡곤란·얼굴 부종은 즉시 응급 진료가 필요합니다.</div></div>`}
function logs(){const list=db.logs.filter(l=>!logDate||l.date===logDate).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));return title('한 입씩 쌓이는, 아율의 하루','먹은 양과 새로운 재료, 아기의 반응을 함께 기록해요.','addLog','기록 추가')+`<div class="toolbar"><div class="date-select"><input type="date" id="logDate" aria-label="기록 날짜 필터" value="${logDate}">${button('allLogs','전체 날짜','text-btn')}</div>${button('csvLogs',icon('download')+'기록 CSV','text-btn')}</div><div class="record-list">${list.map(l=>`<article class="record-row"><div class="stat-icon">${icon('bowl')}</div><div class="info"><h3>${esc(l.name)}</h3><p>${esc(l.date)} · ${slots.find(s=>s[0]===l.slot)?.[1]||''} · 제공 ${fmt(l.offered)}g</p><p>${l.ingredient?'새 재료: '+esc(l.ingredient)+' · ':''}반응: ${esc(l.symptom)}${l.note?' · '+esc(l.note):''}</p></div><strong class="amount">${fmt(l.eaten)}<small> g</small></strong>${button('editLog',icon('edit'),'row-delete','data-id="'+esc(l.id)+'" aria-label="식사 기록 수정"')}${button('deleteLog',icon('close'),'row-delete','data-id="'+esc(l.id)+'" aria-label="식사 기록 삭제"')}</article>`).join('')||'<div class="empty-state">🌱<br>아직 식사 기록이 없어요.<br>식단표에서 먹은 양을 기록해 보세요.</div>'}</div><div class="tip">♡ <div>원본 표는 식단 계획과 조리량입니다. 실제로 먹은 양이나 알레르기 결과를 임의로 생성하지 않았습니다.</div></div>`}
function shopping(){const done=db.shopping.filter(i=>i.done).length;return title('신선함을 담는, 작은 장바구니','선택한 식단·레시피의 재료를 모아 필요한 것만 준비해요.')+`<div class="section-heading"><div><h2>우리 집 준비 목록</h2><p>${done} / ${db.shopping.length}개 준비 완료</p></div>${button('clearDone','완료 항목 정리','text-btn')}</div><div class="shop-progress"><div style="width:${db.shopping.length?done/db.shopping.length*100:0}%"></div></div><form id="shoppingForm" class="shopping-input"><input name="name" required maxlength="100" placeholder="필요한 재료 추가" aria-label="장보기 재료"><input name="quantity" maxlength="100" placeholder="분량 (선택)" aria-label="장보기 분량" style="max-width:120px"><button class="primary" type="submit">${icon('plus')}추가</button></form><div>${db.shopping.map(i=>`<div class="shop-row ${i.done?'done':''}">${button('toggleShop',i.done?icon('check'):'','check','data-id="'+esc(i.id)+'" aria-label="'+esc(i.name)+' 구매 상태 변경" aria-pressed="'+i.done+'"')}<div class="item">${esc(i.name)}<small>${esc(i.quantity)}</small></div>${button('deleteShop',icon('close'),'row-delete','data-id="'+esc(i.id)+'" aria-label="장보기 항목 삭제"')}</div>`).join('')||'<div class="empty-state">🥬<br>장바구니가 비어 있어요.<br>식단표에서 재료를 담거나 직접 추가해 주세요.</div>'}</div><div class="tip">💡 <div>식단의 여러 끼니에서 같은 레시피가 반복되면 한 조리 배치로 묶습니다. 이미 담긴 재료는 중복 추가하지 않습니다. 채소는 원본의 합계 중량만 표시합니다.</div></div>`}
function render(){const name=db.profile.name;$('#babyName').textContent=name;$('#babyAge').textContent=db.profile.birth?`생후 ${Math.max(0,Math.floor((dt(dayKey(new Date()))-dt(db.profile.birth))/86400000))}일`:'밥솥 이유식 노트';for(const id of ['desktopNav','mobileNav'])$('#'+id).innerHTML=navs.map(([v,i,t,m])=>button('tab',icon(i)+(id==='mobileNav'?m:t),v===tab?'active':'','data-tab="'+v+'"')).join('');$('#content').innerHTML=({daily,week,recipes,ingredients,logs,shopping}[tab])()+footer();if(storageError){storageError=false;notify('기존 저장 데이터를 읽지 못했어요. 원본 표로 열었습니다. 백업을 확인해 주세요.')}}
function openModal(title,body){$('#dialogContent').innerHTML=`<div class="dialog-top"><h2>${esc(title)}</h2>${button('close',icon('close'),'','aria-label="닫기"')}</div>${body}`;if(!$('#dialog').open)$('#dialog').showModal()}
function closeModal(){$('#dialog').close()}
function field(name,label,value='',type='text',attrs=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value??'')}" ${attrs}></label>`}
function selectField(name,label,values,value){return `<label>${label}<select name="${name}" aria-label="${esc(label)}">${values.map(v=>`<option value="${esc(typeof v==='string'?v:v[0])}" ${(typeof v==='string'?v:v[0])===value?'selected':''}>${esc(typeof v==='string'?v:v[1])}</option>`).join('')}</select></label>`}
function textArea(name,label,value=''){return `<label>${label}<textarea name="${name}" maxlength="2000">${esc(value)}</textarea></label>`}
function num(name,label,value,attrs=''){return field(name,label,value,'number','min="0" max="100000" step="0.1" '+attrs)}
function blankRecipe(){return {id:uid(),name:'',symbol:'',stage:'중기',date,grain1:'',dry1:null,soaked1:null,grain2:'',dry2:null,soaked2:null,protein:'소고기',proteinG:null,vegetables:'',vegG:null,broth:'물',ratio:null,brothG:null,portionG:100,portions:3,finalG:null,sourceTotal:null,newFood:'',note:''}}
function editRecipe(id){const r=db.recipes.find(r=>r.id===id)||blankRecipe();openModal(id?'밥솥 레시피 수정':'우리 집 밥솥 레시피',`<form id="recipeForm" data-id="${esc(r.id)}">${field('name','식단명',r.name,'text','required maxlength="100"')}<div class="form-grid three">${selectField('symbol','기호',['','A','B','C','D','E','F'],r.symbol)}${selectField('stage','단계',['초기','중기','후기','완료기'],r.stage)}${field('date','조리 날짜',r.date,'date')}</div><div class="form-group"><h3>곡물 · 불리기 전 / 후</h3><div class="form-grid three">${field('grain1','곡물 1',r.grain1,'text','maxlength="100"')}${num('dry1','불리기 전 (g)',r.dry1)}${num('soaked1','불린 후 (g)',r.soaked1)}${field('grain2','곡물 2',r.grain2,'text','maxlength="100"')}${num('dry2','불리기 전 (g)',r.dry2)}${num('soaked2','불린 후 (g)',r.soaked2)}</div></div><div class="form-group"><h3>단백질 · 채소</h3><div class="form-grid">${field('protein','단백질 종류',r.protein,'text','maxlength="100"')}${num('proteinG','단백질 중량 (g)',r.proteinG)}${field('vegetables','채소 2~3가지 (+로 구분)',r.vegetables,'text','maxlength="200"')}${num('vegG','채소 합계 (g)',r.vegG)}</div></div><div class="form-group"><h3>육수 · 분량</h3><div class="form-grid three">${field('broth','육수 종류',r.broth,'text','maxlength="100"')}${num('ratio','배죽 배수',r.ratio)}${num('brothG','실제 육수 중량 (g)',r.brothG)}</div>${button('suggestBroth','불리기 전 곡물 × 배수로 육수 입력','text-btn')}<p class="muted">계산은 보조 기능입니다. 원본은 37g·6배죽·육수 240g으로 단순 계산값과 달라요. 실제 중량을 우선해 주세요.</p><div class="form-grid three">${num('portionG','한 개 분량 (g)',r.portionG)}${num('portions','계획 개수',r.portions,'step="1"')}${num('finalG','조리 후 최종량 (g)',r.finalG)}</div><div class="detail-total" id="recipeCalc"></div></div>${field('newFood','NEW 재료',r.newFood,'text','maxlength="100"')}${textArea('note','조리 메모',r.note)}<p class="muted">빈 중량은 ‘미입력’으로 유지됩니다. B·C·D에는 소고기 베이스가 필요합니다.</p><button class="primary full" type="submit">레시피 저장하기</button>${id?button('deleteRecipe','이 레시피 삭제','delete-link full','data-id="'+esc(id)+'"'):''}</form>`);updateCalc()}
function totals(r){const raw=(r.dry1??0)+(r.dry2??0),grain=(r.soaked1??r.dry1??0)+(r.soaked2??r.dry2??0);const required=[r.grain1?(r.soaked1??r.dry1):null,r.protein?r.proteinG:null,r.vegetables?r.vegG:null,r.brothG];if(r.grain2)required.push(r.soaked2??r.dry2);const complete=required.every(v=>v!=null);const total=grain+(r.proteinG??0)+(r.vegG??0)+(r.brothG??0);const count=r.finalG!=null&&r.portionG>0?Math.floor(r.finalG/r.portionG):null,extra=count!=null?Math.round((r.finalG-count*r.portionG)*10)/10:null;return {raw,total,complete,count,extra}}
const numeric=['dry1','soaked1','dry2','soaked2','proteinG','vegG','brothG','ratio','portionG','portions','finalG'];
function fromRecipeForm(form){const r=Object.fromEntries(new FormData(form));numeric.forEach(k=>r[k]=r[k]===''?null:Number(r[k]));return r}
function updateCalc(){const f=$('#recipeForm');if(!f)return;const r=fromRecipeForm(f),t=totals(r);$('#recipeCalc').innerHTML=`<p class="muted">입력값 기준 자동 계산</p><div class="numbers"><span>재료 합계 <strong>${t.complete?fmt(t.total):'미입력'}</strong><small> ${t.complete?'g':''}</small></span><span>소분 <strong>${fmt(t.count)}</strong><small> ${t.count!=null?'개':''}</small></span><span>여유분 <strong>${fmt(t.extra)}</strong><small> ${t.extra!=null?'g':''}</small></span></div>`}
function recipeDetail(id){const r=db.recipes.find(r=>r.id===id);if(!r)return;const t=totals(r);openModal('밥솥 레시피',`${foodArt(r)}${tag(r.symbol||'첫 밥솥')}${r.newFood?' '+tag('NEW '+r.newFood,'new'):''}<h2 style="margin-top:12px;line-height:1.6">${esc(r.name)}</h2><p class="muted">${esc(r.date||'')} · ${esc(r.stage)}</p><div class="details"><div class="detail"><p>곡물 (불리기 전 → 후)</p><strong>${esc(r.grain1||'미입력')} ${fmt(r.dry1)} → ${fmt(r.soaked1)}g${r.grain2?'<br>'+esc(r.grain2)+' '+fmt(r.dry2)+' → '+fmt(r.soaked2)+'g':''}</strong></div><div class="detail"><p>단백질</p><strong>${esc(r.protein||'미입력')} · ${fmt(r.proteinG)}g</strong></div><div class="detail"><p>채소 (합계)</p><strong>${esc(r.vegetables||'미입력')}<br>${fmt(r.vegG)}g</strong></div><div class="detail"><p>육수</p><strong>${esc(r.broth||'미입력')}<br>${fmt(r.brothG)}g · ${fmt(r.ratio)}배죽</strong></div></div><div class="detail-total"><p class="muted">불린 중량이 있으면 불린 중량, 없으면 생곡물 중량 기준</p><div class="numbers"><span>재료 합계 <strong>${t.complete?fmt(t.total):'미입력'}</strong><small>${t.complete?' g':''}</small></span><span>최종량 <strong>${fmt(r.finalG)}</strong><small> g</small></span></div><p class="muted" style="margin-top:12px">${fmt(r.portionG)}g × 계획 ${fmt(r.portions)}개 · 실제 소분 ${fmt(t.count)}개 · 여유분 ${fmt(t.extra)}g</p></div>${r.sourceTotal!=null?'<div class="tip warning">원본 재료총합 '+fmt(r.sourceTotal)+'g / 앱 계산 '+fmt(t.total)+'g. 원본 합계는 보존했으며, 차이의 원인을 임의로 수정하지 않았습니다.</div>':''}<h3 style="margin:20px 0 10px">조리 메모</h3><p class="source-note">${esc(r.note||'등록된 조리 메모가 없어요.')}</p><div class="tip">🍚 <div>기기의 조리법에 맞춰 충분히 익히고 발달에 맞는 입자로 조절해 주세요. 원본의 만능찜 시간은 당시 기록이며 모든 기기에 적용되는 조리 권장 시간이 아닙니다.</div></div><div class="help-actions">${button('editRecipe',icon('edit')+'수정','outline','data-id="'+esc(id)+'"')}${button('schedule',icon('plus')+'식단에 추가','primary','data-id="'+esc(id)+'"')}${button('shopRecipe',icon('basket')+'재료 담기','outline','data-id="'+esc(id)+'"')}</div>`)}
function pick(slot,d=date){openModal(human(d)+' · '+slots.find(s=>s[0]===slot)[1]+' 메뉴',`<p class="muted">레시피를 선택하거나 직접 메뉴를 입력하세요.</p>${db.recipes.map(r=>button('setMeal',`<span class="emoji">${emoji(r)}</span><div><h3>${esc(r.name)}</h3><p>${esc(r.symbol||'첫 밥솥')} · ${esc(r.vegetables)}</p></div>${icon('plus')}`,'pick-row','data-id="'+esc(r.id)+'" data-slot="'+slot+'" data-date="'+d+'"')).join('')}<form id="customMeal" data-date="${d}" data-slot="${slot}">${field('name','직접 입력 메뉴',plan(d)[slot]||'','text','required maxlength="100"')}<button class="primary full" type="submit">메뉴 저장</button></form>${button('removeMeal','이 끼니 비우기','delete-link full','data-slot="'+slot+'" data-date="'+d+'"')}`)}
function setMeal(d,s,name){db.plans[d]={...plan(d),[s]:name};save();closeModal();render();notify('식단을 저장했어요')}
function schedule(id){const r=db.recipes.find(r=>r.id===id);if(!r)return;openModal('식단에 추가',`<p class="muted">${esc(r.name)}</p><form id="scheduleForm" data-id="${esc(id)}">${field('date','날짜',date,'date','required')}${selectField('slot','끼니',slots.map(s=>[s[0],s[1]]),'morning')}<button class="primary full" type="submit">식단에 추가하기</button></form>`)}
function editDay(d=date){const p=plan(d);openModal(human(d)+' · 새 재료와 메모',`<form id="dayForm" data-date="${d}">${field('newFood','계획한 NEW 재료',p.newFood,'text','maxlength="100"')}${textArea('note','하루 메모',p.note)}<p class="muted">여기에는 계획을 적어요. 실제 테스트 결과는 식사 기록과 재료 상태에 따로 남겨주세요.</p><button class="primary full">저장하기</button></form>`)}
function editIngredient(id){const i=db.ingredients.find(i=>i.id===id)||{id:uid(),name:'',status:'미확인',date:'',note:''};openModal(id?'재료 상태 수정':'새 재료 추가',`<form id="ingredientForm" data-id="${esc(i.id)}">${field('name','재료 이름',i.name,'text','required maxlength="100"')}${selectField('status','확인한 상태',['미확인','테스트 중','통과','주의'],i.status)}${field('date','테스트 / 확인 날짜',i.date,'date')}${textArea('note','증상·특이사항',i.note)}<p class="muted">증상만으로 알레르기를 확정하지 않습니다. 실제 확인된 결과를 직접 선택해 주세요.</p><button class="primary full">재료 저장하기</button>${id?button('deleteIngredient','재료 삭제','delete-link full','data-id="'+esc(id)+'"'):''}</form>`)}
function editLog(id,slot='morning'){const l=db.logs.find(l=>l.id===id)||{id:uid(),date,slot,name:plan()[slot]||'',offered:null,eaten:null,ingredient:plan().newFood||'',symptom:'없음',note:''};openModal(id?'식사 기록 수정':'소중한 한 입 기록',`<form id="logForm" data-id="${esc(l.id)}"><div class="form-grid">${field('date','날짜',l.date,'date','required')}${selectField('slot','끼니',slots.map(s=>[s[0],s[1]]),l.slot)}</div>${field('name','먹은 메뉴',l.name,'text','required maxlength="100"')}<div class="form-grid">${num('offered','제공한 양 (g)',l.offered,'required max="2000"')}${num('eaten','먹은 양 (g)',l.eaten,'required max="2000"')}</div>${field('ingredient','테스트한 새 재료',l.ingredient,'text','maxlength="100"')}${selectField('symptom','관찰한 반응',['없음','발진','구토','설사','기타 반응'],l.symptom)}${textArea('note','반응 발생 시간·식사 메모',l.note)}<p class="muted">새 재료의 ‘통과 / 주의’ 상태는 재료 메뉴에서 직접 확인해 주세요.</p><button class="primary full">기록 저장하기</button></form>`)}
function settings(){openModal('아율의 정보 · 데이터 백업',`<form id="profileForm"><div class="form-grid">${field('name','아기 이름',db.profile.name,'text','required maxlength="30"')}${field('birth','생일 (선택)',db.profile.birth,'date','max="'+dayKey(new Date())+'"')}</div><button class="primary full">아기 정보 저장</button></form><div class="settings-card" style="margin-top:24px"><h3>내 기록을 안전하게 보관해요</h3><p class="source-note">데이터는 이 브라우저에만 저장됩니다. 브라우저 데이터 삭제, 기기·브라우저·HTML 파일 위치 변경 시 기록이 사라지거나 보이지 않을 수 있어요. 중요한 기록은 백업하세요.</p><div class="help-actions">${button('export',icon('download')+'JSON 백업','outline')}${button('import',icon('plus')+'백업 불러오기','outline')}</div><p class="muted">불러오기는 현재 데이터를 교체합니다. 형식을 검사한 뒤 현재 기록 백업을 먼저 내려받습니다.</p></div><div class="settings-card"><h3>HTML 파일 사용 안내</h3><p class="source-note">이 파일 하나를 Chrome·Edge로 열면 됩니다. Git, npm, Node.js 설치와 인터넷 연결이 필요하지 않습니다. 파일 버전 자체는 안드로이드 홈 화면 설치를 제공하지 않습니다.</p></div>${button('source',icon('info')+'두 표에서 반영한 내용','text-btn')}`)}
function source(){openModal('두 표를 이렇게 반영했어요',`<div class="source-note"><p><strong>① 아율 이유식 식단 (밥솥)</strong><br>실제 입력된 첫 조리 기록과 A·B·C 레시피 4개를 옮겼습니다. 곡물의 생중량·불린 중량, 단백질, 채소 합계, 육수, 배죽, 한 개 분량·개수·최종량·NEW·조리 메모를 보존했습니다.</p><p style="margin-top:13px"><strong>② 10월 식단과 통과 재료</strong><br>2026-10-12~31의 날짜, 오전·오후·간식·새 재료·메모를 반영했습니다. 실제 식단 입력은 10/14~21에 있습니다. 통과 재료 9가지와 청경채의 ‘설사’ 메모를 보존했습니다.</p><p style="margin-top:13px"><strong>확인이 필요한 부분</strong><br>첫 표의 10/14 ‘화’와 두 번째 표의 2026-10-14 ‘수’가 다릅니다. 날짜는 연도가 적힌 두 번째 표를 기준으로 표시합니다.<br>당근은 조리표 10/17 NEW, 주간표 10/18 새 재료로 표시되어 실제 테스트 날짜는 미확인입니다.<br>첫 조리의 원본 재료총합은 448.1g이고 앱의 입력값 합계는 451g입니다. 원본 합계를 수정하지 않았습니다.<br>빈 중량, 테스트 통과 결과, 빨간색 서식은 추정하지 않았습니다. 레시피의 단계 ‘중기’는 앱의 초기 분류이며 수정 가능합니다.</p><p style="margin-top:13px"><strong>주간 규칙</strong><br>B·C·D는 소고기 베이스 필수, 화요일 DEF 준비·금요일 ABC 준비·토요일 신규 간식. D·E·F의 재료는 제공되지 않아 만들지 않았습니다.</p></div>`)}
function addShopping(recipes){const unique=[...new Map(recipes.filter(Boolean).map(r=>[r.id,r])).values()];if(!unique.length){notify('먼저 식단에 레시피를 추가해 주세요');return}const items=[];for(const r of unique){for(const [name,amount,detail] of [[r.grain1,r.dry1,'불리기 전'],[r.grain2,r.dry2,'불리기 전'],[r.protein,r.proteinG,''],[r.vegetables,r.vegG,'채소 합계'],[r.broth,r.brothG,'육수']]){if(name)items.push({name,amount,detail,recipe:r.name})}}const grouped=new Map();for(const i of items){const k=i.name+'|'+i.detail;if(!grouped.has(k))grouped.set(k,{...i,amount:0,missing:false});const g=grouped.get(k);if(i.amount==null)g.missing=true;else g.amount+=i.amount}let count=0;for(const g of grouped.values()){const name=g.name+(g.detail?' ('+g.detail+')':'');if(db.shopping.some(i=>i.name===name))continue;db.shopping.push({id:uid(),name,quantity:g.missing?(g.amount?fmt(g.amount)+'g + 미입력 분량':'분량 미입력'):fmt(g.amount)+'g',done:false});count++}save();render();notify(count?count+'가지 재료를 담았어요':'이미 담긴 재료예요')}
function download(filename,text,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportData(){download('아율-이유식-백업-'+dayKey(new Date())+'.json',JSON.stringify(db,null,2));notify('백업 파일을 다운로드했어요')}
function csv(rows,name){const cell=v=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};download(name,'\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
const actions={tab:e=>{tab=e.dataset.tab;search='';render();window.scrollTo(0,0)},goWeek:()=>{tab='week';render()},goRecipes:()=>{tab='recipes';render()},prev:()=>{date=offset(date,tab==='week'?-7:-1);render()},next:()=>{date=offset(date,tab==='week'?7:1);render()},today:()=>{date=dayKey(new Date());render()},openDay:e=>{date=e.dataset.date;tab='daily';render()},pick:e=>pick(e.dataset.slot,e.dataset.date||date),setMeal:e=>setMeal(e.dataset.date,e.dataset.slot,db.recipes.find(r=>r.id===e.dataset.id).name),removeMeal:e=>setMeal(e.dataset.date,e.dataset.slot,''),editDay:e=>editDay(e.dataset.date||date),addRecipe:()=>editRecipe(),editRecipe:e=>editRecipe(e.dataset.id),recipeDetail:e=>recipeDetail(e.dataset.id),schedule:e=>schedule(e.dataset.id),addLog:e=>editLog(undefined,e.dataset.slot||'morning'),editLog:e=>editLog(e.dataset.id),addIngredient:()=>editIngredient(),editIngredient:e=>editIngredient(e.dataset.id),filterRecipe:e=>{recipeFilter=e.dataset.value;render()},filterMaterial:e=>{materialFilter=e.dataset.value;render()},allLogs:()=>{logDate='';render()},close:closeModal,settings,source,export:exportData,import:()=>$('#importFile').click(),print:()=>window.print(),shopDay:()=>{const days=tab==='week'?Array.from({length:7},(_,i)=>offset(monday(date),i)):[date];addShopping(days.flatMap(d=>slots.map(s=>recipe(plan(d)[s[0]]))))},shopRecipe:e=>addShopping([db.recipes.find(r=>r.id===e.dataset.id)]),toggleShop:e=>{const i=db.shopping.find(i=>i.id===e.dataset.id);i.done=!i.done;save();render()},deleteShop:e=>{db.shopping=db.shopping.filter(i=>i.id!==e.dataset.id);save();render()},clearDone:()=>{db.shopping=db.shopping.filter(i=>!i.done);save();render()},deleteLog:e=>{if(confirm('이 식사 기록을 삭제할까요?')){db.logs=db.logs.filter(l=>l.id!==e.dataset.id);save();render()}},deleteIngredient:e=>{if(confirm('이 재료 상태를 삭제할까요?')){db.ingredients=db.ingredients.filter(i=>i.id!==e.dataset.id);save();closeModal();render()}},deleteRecipe:e=>{if(confirm('이 레시피를 삭제할까요? 기존 식단의 메뉴 이름은 남습니다.')){db.recipes=db.recipes.filter(r=>r.id!==e.dataset.id);save();closeModal();render()}},suggestBroth:()=>{const f=$('#recipeForm'),r=fromRecipeForm(f);if((r.dry1==null&&r.dry2==null)||r.ratio==null){notify('생곡물 중량과 배죽 배수를 먼저 입력해 주세요');return}f.elements.brothG.value=Math.round(((r.dry1??0)+(r.dry2??0))*r.ratio*10)/10;updateCalc()},csvLogs:()=>csv([['날짜','끼니','메뉴','제공량(g)','섭취량(g)','새 재료','반응','메모'],...db.logs.map(l=>[l.date,slots.find(s=>s[0]===l.slot)[1],l.name,l.offered,l.eaten,l.ingredient,l.symptom,l.note])],'아율-식사기록.csv'),csvPlans:()=>{const start=monday(date);csv([['날짜','오전','오후','간식','새 재료','메모'],...Array.from({length:7},(_,i)=>{const d=offset(start,i),p=plan(d);return[d,p.morning,p.afternoon,p.snack,p.newFood,p.note]})],'아율-주간식단.csv')}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){const action=actions[b.dataset.action];if(action){e.preventDefault();action(b)}}});
document.addEventListener('input',e=>{if(e.target.closest('#recipeForm'))updateCalc();if(e.target.id==='recipeSearch'){search=e.target.value;$('#recipeResults').innerHTML=recipeResults()}});
document.addEventListener('change',e=>{if(e.target.id==='selectedDate'&&e.target.value){date=e.target.value;render()}if(e.target.id==='logDate'){logDate=e.target.value;render()}});
document.addEventListener('submit',e=>{const f=e.target;if(!['recipeForm','dayForm','ingredientForm','logForm','profileForm','customMeal','scheduleForm','shoppingForm'].includes(f.id))return;e.preventDefault();const data=Object.fromEntries(new FormData(f));if(f.id==='recipeForm'){const r={...fromRecipeForm(f),id:f.dataset.id};r.name=r.name.trim();if(!r.name){notify('식단명을 입력해 주세요');return}if(r.symbol&&'BCD'.includes(r.symbol)&&!r.protein.includes('소고기')){notify('B·C·D는 소고기 베이스가 필요해요');return}if(r.portions!=null&&!Number.isInteger(r.portions)){notify('계획 개수는 정수로 입력해 주세요');return}if(db.recipes.some(x=>x.id!==r.id&&x.name===r.name)){notify('같은 이름의 레시피가 있어요. 다른 이름을 입력해 주세요');return}const old=db.recipes.find(x=>x.id===r.id);r.sourceTotal=old?.sourceTotal??null;if(old&&old.name!==r.name)for(const p of Object.values(db.plans))for(const [slot] of slots)if(p[slot]===old.name)p[slot]=r.name;db.recipes=old?db.recipes.map(x=>x.id===r.id?r:x):[...db.recipes,r]}else if(f.id==='dayForm'){db.plans[f.dataset.date]={...plan(f.dataset.date),...data}}else if(f.id==='ingredientForm'){data.name=data.name.trim();if(!data.name){notify('재료 이름을 입력해 주세요');return}if(db.ingredients.some(i=>i.id!==f.dataset.id&&i.name===data.name)){notify('이미 등록된 재료예요');return}const i={...data,id:f.dataset.id};db.ingredients=db.ingredients.some(x=>x.id===i.id)?db.ingredients.map(x=>x.id===i.id?i:x):[...db.ingredients,i]}else if(f.id==='logForm'){const l={...data,id:f.dataset.id,offered:Number(data.offered),eaten:Number(data.eaten)};if(l.eaten>l.offered){notify('먹은 양은 제공한 양보다 클 수 없어요');return}l.name=l.name.trim();if(!l.name){notify('메뉴를 입력해 주세요');return}db.logs=db.logs.some(x=>x.id===l.id)?db.logs.map(x=>x.id===l.id?l:x):[...db.logs,l]}else if(f.id==='profileForm'){data.name=data.name.trim();if(!data.name){notify('아기 이름을 입력해 주세요');return}db.profile=data}else if(f.id==='customMeal'){setMeal(f.dataset.date,f.dataset.slot,data.name.trim());return}else if(f.id==='scheduleForm'){setMeal(data.date,data.slot,db.recipes.find(r=>r.id===f.dataset.id).name);return}else if(f.id==='shoppingForm'){const name=data.name.trim();if(!name)return;db.shopping.push({id:uid(),name,quantity:data.quantity.trim(),done:false});save();render();notify('재료를 추가했어요');return}const ok=save();closeModal();render();if(ok)notify('저장했어요')});
$('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5000000)throw Error('파일은 5MB 이하만 지원합니다');const next=JSON.parse(await file.text());if(!valid(next))throw Error('아율 이유식 백업 형식이 아니거나 데이터가 올바르지 않습니다');if(!confirm('현재 기록을 백업한 뒤 이 파일의 데이터로 교체할까요?'))return;exportData();db=next;save();closeModal();render();notify('백업 데이터를 불러왔어요')}catch(err){notify('불러오기 실패: '+err.message)}finally{e.target.value=''}});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=$('#dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
